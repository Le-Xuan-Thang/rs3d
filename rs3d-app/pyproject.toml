[project]
name = "rs3d-app"
version = "0.2.3"
description = "Status, live view and data export for Raspberry Shake 3D over Ethernet"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "obspy>=1.5.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "paramiko>=4",
    "keyring>=25",
    "platformdirs>=4",
    "psutil>=6",
    "tomli-w>=1.2",
    "nicegui>=3.0",
]

[project.scripts]
rs3d-app = "rs3d.cli:main"

[project.optional-dependencies]
desktop = ["pywebview>=5"]

[project.gui-scripts]
rs3d-desktop = "rs3d.desktop:main"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=8.0",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rs3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "device: needs a Raspberry Shake connected over Ethernet",
    "e2e: drives the app in a real Chrome browser (slow)",
]
addopts = "-m 'not device and not e2e'"
