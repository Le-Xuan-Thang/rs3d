[project]
name = "rs3d-app"
version = "0.1.0"
description = "Status, live view and data export for Raspberry Shake 3D over Ethernet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "obspy>=1.5.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "paramiko>=4",
    "keyring>=25",
    "platformdirs>=4",
    "psutil>=6",
    "tomli-w>=1.2",
    "nicegui>=3.0",
]

[project.scripts]
rs3d-app = "rs3d.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rs3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["device: needs a Raspberry Shake connected over Ethernet"]
addopts = "-m 'not device'"
