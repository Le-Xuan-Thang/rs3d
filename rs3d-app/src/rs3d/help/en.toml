# ---------------------------------------------------------------- (?) texts

[help.laptop_ip]
short = "The laptop needs a 169.254.x.x address on the cable to reach the Shake."
detail = """
The Shake has no DHCP server on the cable, so both sides use **link-local** addresses (`169.254.x.x`).

**Fix:** press **Set IP**. The app asks your OS for permission, then lets it pick a free link-local address:

- Linux: `nmcli connection modify <connection> ipv4.link-local enabled`
- Windows: switch the Ethernet adapter to DHCP (Windows then self-assigns 169.254.x.x)
- macOS: `networksetup -setdhcp <service>`

Check that the cable is plugged in and the Shake is powered.
"""

[help.seedlink]
short = "Live data port of the Shake (TCP 18000)."
detail = """
The app reads live data with **SeedLink** on port 18000.

If this fails: check the cable, wait 3–5 minutes after powering the Shake, and check the IP in **Settings**.
"""

[help.channels]
short = "Channels served by the Shake. An RS3D has EHZ, EHN and EHE."
detail = "EHZ = vertical, EHN = north–south, EHE = east–west, 100 samples per second."

[help.ssh]
short = "The app logs in (read-only) to read clock, storage and archive."
detail = """
SSH (port 22) with the user and password from **Settings**. The app never changes anything on the Shake.
"""

[help.ssh.auth]
short = "Wrong user name, password or key."
detail = "Open **Settings**, enter the Shake's SSH password (default `shakeme` unless changed) and press **Test connection**."

[help.ssh.unreachable]
short = "Cannot reach the Shake on port 22."
detail = "Check the cable and the IP in **Settings**. SSH must be enabled on the Shake (it is by default)."

[help.ssh.hostkey]
short = "The Shake's identity changed."
detail = """
The Shake answered with a different SSH host key than before. This is normal after re-installing the Shake's SD card.

If that is the case, delete the line for this IP from the app's `known_hosts` file in the data folder (see **Settings**) and refresh.
"""

[help.ssh.command]
short = "A read command failed on the Shake."
detail = "Refresh. If it keeps failing, the Shake software may be different from the tested version (Shake OS 0.21)."

[help.clock]
short = "Time offset of the Shake and its time source (ntpq)."
detail = """
Seismic timestamps come from the Shake's clock, kept right by **ntpd**.

- Internet servers via Wi-Fi (current setup), or
- the laptop (`169.254.8.11`) as a backup, or
- a USB GPS (planned).
"""

[help.clock.offset]
short = "The Shake clock is off by more than 100 ms."
detail = "Data timestamps are unreliable. Check Internet / Wi-Fi on the Shake (see **Internet**) and wait a few minutes for ntpd."

[help.clock.nosource]
short = "The Shake has no time source."
detail = """
`ntpq -p` shows no selected server (`*`). Without one the clock drifts, and after a power cut it restarts from an old time.

Fix Internet on the Shake (see **Internet** and **Wi-Fi**) or connect the laptop that serves time.
"""

[help.clock.sync]
short = "The Shake clock is off and it has no time source."
detail = """
After a power cut the Shake starts with an old time (it has no battery clock) until its time service (**ntpd**) reaches a source.

Press **Sync clock**, then **Sync now**: the app restarts ntpd, which steps the clock from the laptop (`169.254.8.11`) or from Internet servers over Wi-Fi. If that does not work within 30 s, **Set from laptop** copies this laptop's UTC time to the Shake.

Data recorded while the clock was wrong keeps the wrong timestamps.
"""

[help.clock.laptop]
short = "The Shake is synced, but this laptop's clock differs from it."
detail = "The Shake has a selected time source, so its clock is probably right. Check this laptop's time (`timedatectl`) rather than changing the Shake."

[help.internet]
short = "Whether the Shake reaches the Internet (needed for its clock)."
detail = "The Shake uses Wi-Fi for Internet time. Data still flows to the laptop over the cable without Internet."

[help.wifi]
short = "The Shake's Wi-Fi address."
detail = "Wi-Fi is used only for Internet time. The app always talks to the Shake over the cable."

[help.wifi.duplicate]
short = "Two Wi-Fi addresses: Internet will come and go."
detail = """
Two DHCP clients manage `wlan0` on the Shake. See **Guide → Wi-Fi: two addresses**.

Fix (on the Shake): move `denyinterfaces wlan0` to the top of `/etc/dhcpcd.conf`, then reboot.
"""

[help.storage]
short = "Free space on the Shake's SD card."
detail = "The Shake needs space for its archive (about 85 MB per day)."

[help.archive]
short = "Days stored on the Shake, and how long it keeps them."
detail = """
The Shake writes one miniSEED file per channel per day and deletes days older than its retention (`archkeep`).
RS3D expects 30 days; it warns when the Shake keeps fewer.

Whatever the retention, download the days you need on the **Data** page before they are deleted.
"""

[help.archive.none]
short = "No archive found on the Shake."
detail = "Archiving may be disabled in the Shake web settings. Live data still works."

[help.archive.keep]
short = "The Shake keeps fewer days than the 30 RS3D expects."
detail = """
Raise the archive retention (`archkeep`) to 30 days in the Shake web settings. 30 days need about 2.6 GB on the SD card
(about 85 MB per day), so check **Storage** first. Steps for developers: `docs/dev/archive-retention.md`.
"""

[help.archive.atrisk]
short = "Some days will soon be deleted on the Shake and are not downloaded."
detail = "Open **Data**, select those days and press **Download & preview**."

[help.forwarding]
short = "Whether the Shake shares data publicly with Raspberry Shake."
detail = "When ON and the Shake has Internet, its data and location are public on ShakeNet. Turn it off in the Shake web settings (Data Sharing)."

[help.password]
short = "Whether the Shake still uses the default password."
detail = "Change it: SSH into the Shake and run `passwd`, then update the password in **Settings**."

[help.unreadable]
short = "Unexpected answer from the Shake."
detail = "Refresh. If it persists, the Shake software may differ from the tested version."

[help.import]
short = "Add a miniSEED file (any station) to this laptop's data folder."
detail = """
The file is split into one file per channel per day (SDS layout) in the data folder, next to data downloaded from Shakes.

Importing the same file twice changes nothing. Data from other stations appears in the **Station** list.
"""

[help.timezone]
short = "Show times in UTC or in this laptop's time zone. Files and code always use UTC."
detail = "Seismic data is always stored in UTC. The Local option only changes what you see and type."

[help.presets]
short = "Quick time ranges."
detail = "\"Today\" and \"Yesterday\" follow the time zone shown (UTC or Local)."

[help.coverage]
short = "Green: on this laptop. Grey: still on the Shake. Red: no data. Blue: your selection."
detail = """
The strip shows, for the first channel, what exists for the time you are looking at.

- **Green** — already on this laptop. Preview and export read it directly.
- **Grey** — recorded and still on the Shake, not copied yet. **Download & preview** copies it. Today's grey part is
  never turned green for good, because the Shake keeps writing to it.
- **Red** — no data anywhere: the Shake was off or not recording, or the day is older than the Shake keeps
  (see **Archive** on the Status page) and was never downloaded. It cannot be recovered.
- **Blue** — your selection (the lower bar). The time after "now" is left blank.

How to use it: drag in the lower bar to select a range; drag its handles to change Start/End; drag the middle to move it.
**Week / Day / Hour** and the arrows change the visible span. The Start/End fields and the selection always follow
each other.
"""

[help.files_needed]
short = "Parts of the Shake's day files that cover your selection and are not on this laptop yet."
detail = """
**Download & preview** copies only the part of each day file that covers **Start** to **End** (about 330 bytes per
second per channel), not the whole day. The number is how many pieces will be copied (one per channel and day) and
roughly how big they are.

Parts you already have are not copied again. A later selection in the same day adds its part to the same file. If the
Shake's file cannot be read part by part, the whole day file is copied instead.
"""

[help.units]
short = "counts = raw digitizer values; m/s = ground velocity."
detail = """
m/s needs the instrument response. The app downloads it once from the Raspberry Shake service (laptop needs Internet that time) and keeps it.
"""

[help.code]
short = "ObsPy code that reproduces this exact export."
detail = "It reads from this laptop's data folder, so it runs without the Shake."

[help.freq_page]
short = "Finds the frequencies the structure vibrates at."
detail = """
Pick a time range (a few hours of quiet data is enough) and press **Find frequencies**.

The range is cut into blocks of 5–30 minutes. Each block gets a spectrum, and the page shows the **median** of all
blocks. Peaks that stand out by at least 6 dB are listed. **Present in (%)** is the share of blocks where the peak
appears: a structure or a steady machine is there almost always (80 % or more = **stable**), a footstep or a truck is not.

**Contrast** is how far the peak rises above the spectrum just beside it. **Spread** is how much the peak frequency moves
from block to block.

A stable peak is a *candidate* for a natural frequency of the structure. It can also come from a machine, a pump or
a fan. To be sure, switch the suspected source off and on and compare, or measure at another floor of the building.
Z is up-down; N and E are horizontal (the direction is not checked).
"""

[help.freq_preview]
short = "The data of the range and channel you chose."
detail = """
**Channel:** Z is up-down, N and E are horizontal. The waveform, **Find frequencies** and the result all follow this choice.

**Waveform:** the range as raw counts (the constant offset removed), drawn as the lowest and highest value of each
small step so short spikes stay visible. **Box zoom** (the crop button): switch it on, then drag across the waveform.
The chart zooms in and **Start/End** follow, so **Find frequencies** analyses exactly what you see. The fit button returns
to the range you typed or picked. Gaps in the data are left blank.
"""

[help.freq_units]
short = "counts = raw numbers from the Shake; m/s = ground velocity."
detail = "Peak frequencies are the same in both. Use **m/s** to compare levels between places or reports; it needs the instrument response, downloaded once from the Internet and then kept."

[help.live_filter]
short = "Band-pass 1–10 Hz to hide slow drift and high-frequency noise."
detail = "Applied only to the display. Use the Data page to export filtered data."

[help.events]
short = "Raises an alert when the ground shakes much harder than usual."
detail = """
RS3D compares the **short-term average** (STA) of the vertical signal with its **long-term average** (LTA).
When STA / LTA rises above **On**, an event starts; it ends when the ratio falls below **Reset**.

The same detector runs on the live stream and on every downloaded day, so events show up on the Live page,
the Data page and the helicorder. Changes apply to the live detector at once; old data is not re-scanned
(use **Rescan** on the Data page).

The detector stays quiet for the first LTA seconds after start-up or after a gap in the data.
"""

[help.events.sta]
short = "Length of the short window in seconds."
detail = "A short window reacts quickly. **6 s** is the value used in rsudp here. Must be shorter than LTA."

[help.events.lta]
short = "Length of the long window in seconds."
detail = "The long window is the background level. **30 s** here. Must be longer than STA."

[help.events.on]
short = "STA / LTA above this value starts an event."
detail = "Higher means fewer, stronger events. **3.95** here (stock rsudp uses 1.6). Must be higher than Reset."

[help.events.reset]
short = "STA / LTA below this value ends the event."
detail = "**0.9** here. Must be lower than On and above 0."

[help.events.band]
short = "Only frequencies between high-pass and low-pass are analysed."
detail = """
Traffic and wind are strongest outside the band where most earthquakes show up. **0.8 to 9 Hz** here.
High-pass must be above 0 and below low-pass; low-pass must be below the Nyquist frequency (50 Hz for a 100 Hz Shake).
"""
