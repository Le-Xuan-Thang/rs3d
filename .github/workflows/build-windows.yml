name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: rs3d-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: choco install innosetup -y --no-progress
      - run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RS3D-windows
          path: |
            rs3d-app/dist/RS3D-Portable-*.zip
            rs3d-app/dist/RS3D-Setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RS3D-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            RS3D-Portable-*.zip
            RS3D-Setup-*.exe
