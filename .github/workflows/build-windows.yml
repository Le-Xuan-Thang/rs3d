name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: rs3d-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: choco install innosetup -y --no-progress
      - run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: RS3D-windows
          path: |
            rs3d-app/dist/RS3D-Portable-*.zip
            rs3d-app/dist/RS3D-Setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: RS3D-windows
      - name: Release notes from CHANGELOG.md
        working-directory: ${{ github.workspace }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## What's new in ${version}"
            awk -v v="## ${version}" '$0 == v {f=1; next} /^## /{f=0} f' CHANGELOG.md | sed '/./,$!d'
            echo
            echo "## Download"
            echo "- **RS3D-Setup-${version}.exe**: Windows installer."
            echo "- **RS3D-Portable-${version}.zip**: portable version (unzip and run RS3D.exe; data stays in a \`data\` folder beside it)."
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
          } > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            RS3D-Portable-*.zip
            RS3D-Setup-*.exe
